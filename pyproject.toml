[project]
name = "relais"
version = "0.3.0"
description = "A framework for building multi-step AI agent pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.17.0",
    "claude-agent-sdk>=0.2.0",
    "spool @ git+https://github.com/bm13563/spool.git",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/relais"]
